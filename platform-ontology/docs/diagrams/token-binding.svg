<svg viewBox="0 0 920 500" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Ingress assembles request context from three evidence sources — the request URL, the JWT, and the session cookie — then checks the resolved context against entitlement grants distributed from the control plane. The token carries no entitlements.">
  <defs>
    <marker id="tbArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="tbArrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <text x="150" y="26" text-anchor="middle" font-size="12" fill="currentColor" opacity=".75" font-weight="600">Three evidence sources</text>
  <text x="470" y="26" text-anchor="middle" font-size="12" fill="currentColor" opacity=".75" font-weight="600">Resolved context</text>
  <text x="782" y="26" text-anchor="middle" font-size="12" fill="var(--accent-ink)" font-weight="600">Authority</text>

  <!-- 1. request URL -->
  <rect x="18" y="42" width="264" height="86" rx="9" fill="var(--m-ingress)" opacity=".10"/>
  <rect x="18" y="42" width="264" height="86" rx="9" fill="none" stroke="var(--m-ingress)" stroke-width="1.5"/>
  <text x="36" y="64" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--m-ingress)" font-weight="600">1 · request URL + landing point</text>
  <text x="36" y="84" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".8">domain / path → tenant</text>
  <text x="36" y="102" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".8">which ingress deployment</text>
  <text x="36" y="120" font-size="10" fill="currentColor" opacity=".55">bound in ingress route config</text>

  <!-- 2. JWT -->
  <rect x="18" y="140" width="264" height="152" rx="9" fill="var(--m-session)" opacity=".10"/>
  <rect x="18" y="140" width="264" height="152" rx="9" fill="none" stroke="var(--m-session)" stroke-width="1.5"/>
  <text x="36" y="162" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--m-session)" font-weight="600">2 · JWT — identity + assurance</text>
  <g font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor">
    <text x="36" y="184" opacity=".8">iss / aud / exp</text>
    <text x="36" y="204" opacity=".8">sub</text>
    <text x="36" y="224" opacity=".8">azp</text>
    <text x="36" y="244" opacity=".8">acr / amr / auth_time</text>
    <text x="36" y="268" fill="var(--violation)">scope / permissions</text>
    <text x="36" y="283" font-size="9.5" fill="var(--violation)" opacity=".85">ignored at ingress — Level 3</text>
  </g>

  <!-- 3. cookie -->
  <rect x="18" y="304" width="264" height="66" rx="9" fill="var(--m-authn)" opacity=".10"/>
  <rect x="18" y="304" width="264" height="66" rx="9" fill="none" stroke="var(--m-authn)" stroke-width="1.5"/>
  <text x="36" y="326" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--m-authn)" font-weight="600">3 · session cookie</text>
  <text x="36" y="346" font-family="IBM Plex Mono, monospace" font-size="11" fill="currentColor" opacity=".8">opaque handle → session id</text>
  <text x="36" y="362" font-size="10" fill="currentColor" opacity=".55">no sid claim in the token</text>

  <!-- arrows to resolved -->
  <g stroke="currentColor" stroke-width="1.2" fill="none" opacity=".6">
    <line x1="286" y1="76" x2="352" y2="76" marker-end="url(#tbArr)"/>
    <line x1="286" y1="104" x2="352" y2="128" marker-end="url(#tbArr)"/>
    <line x1="286" y1="204" x2="352" y2="182" marker-end="url(#tbArr)"/>
    <line x1="286" y1="224" x2="352" y2="234" marker-end="url(#tbArr)"/>
    <line x1="286" y1="244" x2="352" y2="286" marker-end="url(#tbArr)"/>
    <line x1="286" y1="337" x2="352" y2="337" marker-end="url(#tbArr)"/>
  </g>

  <!-- resolved nodes -->
  <g font-family="IBM Plex Mono, monospace" font-size="11.5">
    <rect x="356" y="60" width="222" height="32" rx="6" fill="var(--m-core)" opacity=".13"/>
    <rect x="356" y="60" width="222" height="32" rx="6" fill="none" stroke="var(--m-core)" stroke-width="1.3"/>
    <text x="467" y="81" text-anchor="middle" fill="var(--m-core)">Tenant</text>

    <rect x="356" y="112" width="222" height="32" rx="6" fill="var(--m-control-plane)" opacity=".13"/>
    <rect x="356" y="112" width="222" height="32" rx="6" fill="none" stroke="var(--m-control-plane)" stroke-width="1.3"/>
    <text x="467" y="133" text-anchor="middle" fill="var(--m-control-plane)">environment · region</text>

    <rect x="356" y="164" width="222" height="32" rx="6" fill="var(--m-authn)" opacity=".13"/>
    <rect x="356" y="164" width="222" height="32" rx="6" fill="none" stroke="var(--m-authn)" stroke-width="1.3"/>
    <text x="467" y="185" text-anchor="middle" fill="var(--m-authn)">SubjectIdentifier → Principal</text>

    <rect x="356" y="216" width="222" height="32" rx="6" fill="var(--m-core)" opacity=".13"/>
    <rect x="356" y="216" width="222" height="32" rx="6" fill="none" stroke="var(--m-core)" stroke-width="1.3"/>
    <text x="467" y="237" text-anchor="middle" fill="var(--m-core)">AuthorizedParty → channel</text>

    <rect x="356" y="268" width="222" height="32" rx="6" fill="var(--m-authn)" opacity=".13"/>
    <rect x="356" y="268" width="222" height="32" rx="6" fill="none" stroke="var(--m-authn)" stroke-width="1.3"/>
    <text x="467" y="289" text-anchor="middle" fill="var(--m-authn)">JourneyExecution → AAL</text>

    <rect x="356" y="320" width="222" height="32" rx="6" fill="var(--m-session)" opacity=".13"/>
    <rect x="356" y="320" width="222" height="32" rx="6" fill="none" stroke="var(--m-session)" stroke-width="1.3"/>
    <text x="467" y="341" text-anchor="middle" fill="var(--m-session)">Session</text>
  </g>

  <!-- grants -->
  <rect x="622" y="96" width="282" height="128" rx="9" fill="var(--accent)" opacity=".09"/>
  <rect x="622" y="96" width="282" height="128" rx="9" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
  <text x="763" y="122" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--accent-ink)" font-weight="600">EntitlementGrant</text>
  <text x="763" y="142" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">never in the token, never in the URL</text>
  <text x="763" y="166" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".68">grantedTo · onDimension · entitlementValue</text>
  <text x="763" y="184" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".68">derivedFrom · distributedAt</text>
  <text x="763" y="208" text-anchor="middle" font-size="10.5" fill="var(--accent-ink)">revocable without re-minting anything</text>

  <g stroke="var(--accent)" stroke-width="1.5" fill="none">
    <line x1="582" y1="160" x2="618" y2="160" marker-end="url(#tbArrG)"/>
  </g>
  <text x="600" y="152" text-anchor="middle" font-size="10" fill="var(--accent-ink)">checked</text>

  <!-- decision -->
  <rect x="622" y="252" width="282" height="56" rx="8" fill="var(--m-authz)" opacity=".12"/>
  <rect x="622" y="252" width="282" height="56" rx="8" fill="none" stroke="var(--m-authz)" stroke-width="1.4"/>
  <text x="763" y="275" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="var(--m-authz)" font-weight="600">IngressAdmissionDecision</text>
  <text x="763" y="294" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".7">subject · action · target · viaChannel</text>
  <g stroke="currentColor" stroke-width="1.3" fill="none" opacity=".7">
    <line x1="763" y1="228" x2="763" y2="248" marker-end="url(#tbArr)"/>
  </g>

  <!-- footer note -->
  <rect x="18" y="392" width="886" height="92" rx="9" fill="var(--panel-2)" stroke="var(--rule)" stroke-width="1.2"/>
  <text x="42" y="417" font-size="12.5" font-weight="600" fill="currentColor">Two bindings that exist in configuration but not in the ontology</text>
  <g font-size="11.5" fill="currentColor" opacity=".82">
    <text x="42" y="441">domain / path → Tenant — set in ingress route config; the ingress module models no host or path matching, and no tenant binding.</text>
    <text x="42" y="465">session cookie → Session — the handle is credential-like, but nothing states how a request resolves to a session.</text>
  </g>
</svg>
