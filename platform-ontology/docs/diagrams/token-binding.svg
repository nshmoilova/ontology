<svg viewBox="0 0 900 470" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="JWT claims resolve to ontology nodes as evidence, while entitlement grants distributed from the control plane supply the authority; the token carries no entitlements.">
  <defs>
    <marker id="tbArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="tbArrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- token -->
  <rect x="24" y="60" width="196" height="246" rx="9" fill="var(--m-session)" opacity=".10"/>
  <rect x="24" y="60" width="196" height="246" rx="9" fill="none" stroke="var(--m-session)" stroke-width="1.5"/>
  <text x="122" y="84" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--m-session)" font-weight="600">JWT</text>
  <text x="122" y="101" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".62">evidence of identity + context</text>

  <g font-family="IBM Plex Mono, monospace" font-size="11.5" fill="currentColor">
    <text x="44" y="128">iss / aud / exp</text>
    <text x="44" y="152">sub</text>
    <text x="44" y="176">org_id</text>
    <text x="44" y="200">azp</text>
    <text x="44" y="224">sid</text>
    <text x="44" y="248">acr / amr</text>
    <text x="44" y="278" fill="var(--violation)">scope / permissions</text>
    <text x="44" y="294" font-size="9.5" fill="var(--violation)" opacity=".85">ignored at ingress — Level 3</text>
  </g>

  <!-- resolution arrows -->
  <g stroke="currentColor" stroke-width="1.2" fill="none" opacity=".62">
    <line x1="224" y1="148" x2="326" y2="130" marker-end="url(#tbArr)"/>
    <line x1="224" y1="172" x2="326" y2="172" marker-end="url(#tbArr)"/>
    <line x1="224" y1="196" x2="326" y2="214" marker-end="url(#tbArr)"/>
    <line x1="224" y1="220" x2="326" y2="256" marker-end="url(#tbArr)"/>
    <line x1="224" y1="244" x2="326" y2="298" marker-end="url(#tbArr)"/>
  </g>

  <!-- resolved nodes -->
  <g font-family="IBM Plex Mono, monospace" font-size="11.5">
    <rect x="330" y="112" width="212" height="34" rx="6" fill="var(--m-authn)" opacity=".12"/>
    <rect x="330" y="112" width="212" height="34" rx="6" fill="none" stroke="var(--m-authn)" stroke-width="1.3"/>
    <text x="436" y="134" text-anchor="middle" fill="var(--m-authn)">SubjectIdentifier → Principal</text>

    <rect x="330" y="155" width="212" height="34" rx="6" fill="var(--m-core)" opacity=".12"/>
    <rect x="330" y="155" width="212" height="34" rx="6" fill="none" stroke="var(--m-core)" stroke-width="1.3"/>
    <text x="436" y="177" text-anchor="middle" fill="var(--m-core)">Tenant</text>

    <rect x="330" y="198" width="212" height="34" rx="6" fill="var(--m-core)" opacity=".12"/>
    <rect x="330" y="198" width="212" height="34" rx="6" fill="none" stroke="var(--m-core)" stroke-width="1.3"/>
    <text x="436" y="220" text-anchor="middle" fill="var(--m-core)">AuthorizedParty → channel</text>

    <rect x="330" y="241" width="212" height="34" rx="6" fill="var(--m-session)" opacity=".12"/>
    <rect x="330" y="241" width="212" height="34" rx="6" fill="none" stroke="var(--m-session)" stroke-width="1.3"/>
    <text x="436" y="263" text-anchor="middle" fill="var(--m-session)">Session</text>

    <rect x="330" y="284" width="212" height="34" rx="6" fill="var(--m-authn)" opacity=".12"/>
    <rect x="330" y="284" width="212" height="34" rx="6" fill="none" stroke="var(--m-authn)" stroke-width="1.3"/>
    <text x="436" y="306" text-anchor="middle" fill="var(--m-authn)">JourneyExecution → AAL</text>
  </g>

  <text x="436" y="98" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72" font-weight="600">resolves to — evidence</text>

  <!-- grants -->
  <rect x="596" y="112" width="282" height="120" rx="9" fill="var(--accent)" opacity=".09"/>
  <rect x="596" y="112" width="282" height="120" rx="9" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
  <text x="737" y="137" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--accent-ink)" font-weight="600">EntitlementGrant</text>
  <text x="737" y="156" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">the authority — never in the token</text>
  <text x="737" y="178" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".68">grantedTo · onDimension · entitlementValue</text>
  <text x="737" y="196" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".68">derivedFrom · distributedAt</text>
  <text x="737" y="218" text-anchor="middle" font-size="10.5" fill="var(--accent-ink)">revocable without re-minting any token</text>

  <g stroke="var(--accent)" stroke-width="1.5" fill="none">
    <line x1="546" y1="172" x2="592" y2="172" marker-end="url(#tbArrG)"/>
  </g>
  <text x="569" y="164" text-anchor="middle" font-size="10" fill="var(--accent-ink)">checked</text>
  <text x="569" y="188" text-anchor="middle" font-size="10" fill="var(--accent-ink)">against</text>

  <!-- decision -->
  <rect x="596" y="262" width="282" height="56" rx="8" fill="var(--m-authz)" opacity=".12"/>
  <rect x="596" y="262" width="282" height="56" rx="8" fill="none" stroke="var(--m-authz)" stroke-width="1.4"/>
  <text x="737" y="285" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12.5" fill="var(--m-authz)" font-weight="600">IngressAdmissionDecision</text>
  <text x="737" y="304" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".7">subject · action · target · viaChannel</text>

  <g stroke="currentColor" stroke-width="1.3" fill="none" opacity=".7">
    <line x1="737" y1="236" x2="737" y2="258" marker-end="url(#tbArr)"/>
  </g>

  <!-- aud vs azp -->
  <rect x="24" y="346" width="854" height="96" rx="9" fill="var(--panel-2)" stroke="var(--rule)" stroke-width="1.2"/>
  <text x="50" y="372" font-size="12.5" font-weight="600" fill="currentColor">The two ends of a token's journey</text>
  <g font-size="11.5" fill="currentColor" opacity=".82">
    <text x="50" y="397"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">azp</tspan> · issuedTo → AuthorizedParty — who may PRESENT the token. Channel evidence comes from here, never from a claim.</text>
    <text x="50" y="421"><tspan font-family="IBM Plex Mono, monospace" font-weight="600">aud</tspan> · tokenAudience → Resource — who may ACCEPT it. Neither is derivable from the other.</text>
  </g>
</svg>
