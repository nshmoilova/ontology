<svg viewBox="0 0 900 430" role="img" xmlns="http://www.w3.org/2000/svg"
     aria-label="Three evaluation layers: the control plane projects entitlement grants to ingress, which evaluates platform entitlements then application admission; what the subject may do inside the application is application-owned and out of scope.">
  <defs>
    <marker id="lyArr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="lyArrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
    </marker>
  </defs>

  <!-- control plane -->
  <rect x="470" y="18" width="412" height="56" rx="8" fill="var(--m-control-plane)" opacity=".10"/>
  <rect x="470" y="18" width="412" height="56" rx="8" fill="none" stroke="var(--m-control-plane)" stroke-width="1.4"/>
  <text x="676" y="41" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--m-control-plane)" font-weight="600">Control plane — defines</text>
  <text x="676" y="60" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">tenants · subscriptions · offerings · enablements · registrations</text>

  <g stroke="var(--accent)" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M 470 52 L 296 52 L 296 106" marker-end="url(#lyArrG)"/>
  </g>
  <text x="306" y="86" font-size="11.5" fill="var(--accent-ink)" font-weight="600">projects grants · distributed, timestamped</text>

  <!-- ingress -->
  <rect x="140" y="108" width="312" height="212" rx="9" fill="var(--m-ingress)" opacity=".08"/>
  <rect x="140" y="108" width="312" height="212" rx="9" fill="none" stroke="var(--m-ingress)" stroke-width="1.5"/>
  <text x="296" y="131" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="var(--m-ingress)" font-weight="600">Unified ingress — enforces</text>

  <rect x="162" y="145" width="268" height="72" rx="7" fill="var(--panel)" stroke="var(--m-authz)" stroke-width="1.3"/>
  <text x="296" y="166" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--m-authz)" font-weight="600">Level 1 · platform entitlements</text>
  <text x="296" y="185" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".72">platform · tenant · environment</text>
  <text x="296" y="200" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".72">region · channel</text>
  <text x="296" y="212" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".5">closed scheme — 5 dimensions</text>

  <rect x="162" y="231" width="268" height="72" rx="7" fill="var(--panel)" stroke="var(--m-authz)" stroke-width="1.3"/>
  <text x="296" y="252" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--m-authz)" font-weight="600">Level 2 · application admission</text>
  <text x="296" y="271" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".72">enabled for this tenant, in this scope,</text>
  <text x="296" y="286" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".72">with subscription + offering coverage</text>
  <text x="296" y="298" text-anchor="middle" font-size="9.5" fill="currentColor" opacity=".5">generic: subject → action → target</text>

  <g stroke="currentColor" stroke-width="1.3" fill="none" opacity=".75">
    <line x1="48" y1="181" x2="158" y2="181" marker-end="url(#lyArr)"/>
    <line x1="296" y1="217" x2="296" y2="227" marker-end="url(#lyArr)"/>
    <line x1="454" y1="267" x2="556" y2="267" marker-end="url(#lyArr)"/>
  </g>
  <text x="103" y="172" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">request + token</text>
  <text x="505" y="258" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">admitted</text>

  <!-- level 3 -->
  <rect x="558" y="231" width="324" height="128" rx="9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="6 5" opacity=".5"/>
  <text x="720" y="257" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="currentColor" opacity=".82" font-weight="600">Level 3 · inside the application</text>
  <text x="720" y="281" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">roles, scopes, business rules,</text>
  <text x="720" y="298" text-anchor="middle" font-size="11" fill="currentColor" opacity=".65">record-level and transactional limits</text>
  <text x="720" y="324" text-anchor="middle" font-size="12" fill="var(--violation)" font-weight="600">application-owned · out of scope</text>
  <text x="720" y="344" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".55">the ontology deliberately refuses this question</text>

  <line x1="510" y1="120" x2="510" y2="380" stroke="var(--violation)" stroke-width="1.6" stroke-dasharray="7 5" opacity=".65"/>
  <text x="510" y="112" text-anchor="middle" font-size="11.5" fill="var(--violation)" font-weight="600">the boundary</text>

  <text x="450" y="404" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".7">Two closure invariants police the line: no entitlement outside the dimension scheme, no action outside the action scheme.</text>
</svg>
